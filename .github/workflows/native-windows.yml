# LGPL libmpv + FFmpeg for Windows x64 (third_party/mpv/build-windows.sh) as a reusable job.
# Output artifact "mpv-windows-x64": dist/*.dll (the redistributable DLL set), prefix/bin/ffmpeg.exe,
# prefix/bin/ffprobe.exe, evidence/ (license verification outputs).
#
# Cached by the build script + the recorded MSYS2 package list. Note: pacman installs the CURRENT
# MSYS2 packages, so a fresh build can contain newer DLL versions than
# legal/inventory/native-windows-x64.json. The release workflow then stops (hash/version check in
# scripts/package-windows.ps1) until the inventory and notices are updated on purpose.
name: native-windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpv:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/mpv/_build/dist
            third_party/mpv/_build/prefix/bin/ffmpeg.exe
            third_party/mpv/_build/prefix/bin/ffprobe.exe
            third_party/mpv/_build/evidence
          key: mpv-win64-${{ hashFiles('third_party/mpv/build-windows.sh', 'third_party/mpv/evidence/windows/msys2-packages.txt') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build (LGPL only)
        shell: msys2 {0}
        run: JOBS=4 ./third_party/mpv/build-windows.sh
      - name: License guard
        shell: pwsh
        run: |
          $conf = Get-Content third_party/mpv/_build/evidence/ffmpeg-buildconf.txt -Raw
          if ($conf -match '--enable-(gpl|version3|nonfree)') { throw 'GPL/nonfree FFmpeg configuration' }
          $opts = Get-Content third_party/mpv/_build/evidence/mpv-buildoptions.json -Raw | ConvertFrom-Json
          if (($opts | Where-Object { $_.name -eq 'gpl' }).value -ne $false) { throw 'mpv built with gpl=true' }
          "DLLs: $((Get-ChildItem third_party/mpv/_build/dist -Filter *.dll).Count)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mpv-windows-x64
          path: |
            third_party/mpv/_build/dist
            third_party/mpv/_build/prefix/bin/ffmpeg.exe
            third_party/mpv/_build/prefix/bin/ffprobe.exe
            third_party/mpv/_build/evidence
          retention-days: 30
