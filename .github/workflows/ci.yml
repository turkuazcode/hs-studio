# CI (plan 14/Q01 + R02). Not pushed and never run remotely yet: review before the first push.
# Every third-party action is pinned to a full commit SHA (tag in the comment; looked up
# 2026-10-26 with `git ls-remote`). Update them deliberately, never to a moving tag.
#
# Layers (docs/status/test-map.md):
#   unit   — every push/PR, network-free (npm test blocks non-loopback connections)
#   rust   — every push/PR
#   e2e    — Windows: release exe + the LGPL libmpv/ffmpeg set from native-windows.yml
#   ai     — manual / release candidate; real model downloaded once into a cache keyed by the
#            AI manifest hash
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ai:
        description: "Run the real-AI smoke layer (downloads ~76 MB once per manifest)"
        type: boolean
        default: false

# Least privilege: CI only reads the repository. Fork PRs get no secrets (GitHub default).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24"

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VHO_TEST_NO_SKIP: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-unit
          path: tests/.results/

  rust:
    runs-on: windows-latest
    # restoration/music/export tests run the real ffmpeg/ffprobe of the LGPL set
    needs: [native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mpv-windows-x64
          path: mpv-build
      - name: Stage ffmpeg/ffprobe next to the test binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/target/release | Out-Null
          ./scripts/stage-mpv.ps1 -Source mpv-build\dist -Targets release
      - run: cargo test --release --lib --locked --manifest-path src-tauri/Cargo.toml

  native:
    uses: ./.github/workflows/native-windows.yml

  e2e:
    runs-on: windows-latest
    needs: [unit, rust, native]
    env:
      VHO_E2E_PORT_MIN: "10700"
      VHO_E2E_PORT_MAX: "10799"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mpv-windows-x64
          path: mpv-build
      - run: npm ci
      - run: npm run build:release
      - run: npm run stage:mpv -- -Source mpv-build\dist
      - name: E2E
        run: npm run e2e
        env:
          VHO_TEST_NO_SKIP: "1"
          # The runner has no audio device: libmpv would drop the audio track (no aid, no
          # current-tracks/audio, audio-only files never advance). The null output keeps the
          # timing of a real one.
          VHO_MPV_OPTIONS: "ao=null"
      - name: Restore real-AI model cache
        if: github.event_name == 'workflow_dispatch' && inputs.ai
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.cache/ai-smoke/vho-data/ai
          key: vho-ai-${{ hashFiles('src-tauri/src/ai/manifest.rs') }}
      - name: Real-AI smoke
        if: github.event_name == 'workflow_dispatch' && inputs.ai
        run: npm run test:ai
        env:
          VHO_TEST_NO_SKIP: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-e2e
          path: tests/.results/
