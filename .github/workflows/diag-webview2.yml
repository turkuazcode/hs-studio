# Manual diagnostics for the CI E2E failure "no CDP page on port …" (vho.exe starts, but the
# WebView2 page / debug port never appears on the GitHub Windows runner). Builds the release exe
# like the e2e job, starts it once per variant with the E2E environment (scripts/diag-webview2.mjs)
# and uploads: WebView2 runtime version + Edge/WebView2 policies, process list, the app's
# stdout/stderr, CDP answers, desktop screenshots, Windows event log / WER reports.
name: diag-webview2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24"

jobs:
  native:
    uses: ./.github/workflows/native-windows.yml

  diag:
    runs-on: windows-latest
    needs: [native]
    timeout-minutes: 60
    env:
      VHO_E2E_PORT_MIN: "10700"
      VHO_E2E_PORT_MAX: "10799"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mpv-windows-x64
          path: mpv-build
      - run: npm ci
      - run: npm run build:release
      - run: npm run stage:mpv -- -Source mpv-build\dist
      - name: Environment (OS, session, WebView2 runtime, policies, GPU)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          $wv2 = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          & {
            "== OS"; Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber | Out-String
            "== session"; "user=$env:USERNAME interactive=$([Environment]::UserInteractive) session=$((Get-Process -Id $PID).SessionId) TEMP=$env:TEMP"
            Get-Process explorer, dwm -ErrorAction SilentlyContinue | Format-Table Id, Name, SessionId | Out-String
            "== WebView2 runtime (EdgeUpdate pv)"
            foreach ($k in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$wv2", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$wv2", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$wv2") {
              "$k = $((Get-ItemProperty $k -ErrorAction SilentlyContinue).pv)"
            }
            Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -ErrorAction SilentlyContinue | Format-Table Name | Out-String
            "== Edge / WebView2 policies"
            foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') {
              Get-ChildItem $k -Recurse -ErrorAction SilentlyContinue | Out-String
              Get-ItemProperty $k -ErrorAction SilentlyContinue | Out-String
            }
            "== WEBVIEW2_* environment"; Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*' | Out-String
            "== GPU"; Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, Status | Out-String
            "== binary"; Get-ChildItem src-tauri/target/release -Filter *.exe | Format-Table Name, Length | Out-String
          } *>&1 | Tee-Object diag/environment.txt
      - name: Launch with the E2E environment (libmpv staged, as in the e2e job)
        if: always()
        run: node scripts/diag-webview2.mjs diag a-e2e-env
      - name: Launch again with Chromium logging
        if: always()
        run: node scripts/diag-webview2.mjs diag b-logging "--enable-logging --v=1 --log-file=${{ github.workspace }}\diag\b-logging\chromium.log"
      - name: Windows event log + WER reports
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-2) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Level -le 3 -or $_.ProviderName -match 'Error Reporting|Application Error|Application Hang' } |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message | Out-File -Width 4096 diag/eventlog.txt
          New-Item -ItemType Directory -Force diag/wer | Out-Null
          Get-ChildItem C:\ProgramData\Microsoft\Windows\WER, "$env:LOCALAPPDATA\Microsoft\Windows\WER" -Recurse -Filter Report.wer -ErrorAction SilentlyContinue |
            Where-Object LastWriteTime -gt (Get-Date).AddHours(-2) |
            ForEach-Object { Copy-Item $_.FullName "diag/wer/$($_.Directory.Name).wer" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diag-webview2
          path: diag/
