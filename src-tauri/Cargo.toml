[package]
name = "vho"
version = "0.1.0"
description = "HS Studio: video & fotoğraf medya stüdyosu"
authors = ["TurkuazCode"]
repository = "https://github.com/turkuazcode/hs-studio"
homepage = "https://github.com/turkuazcode/hs-studio"
license = "Apache-2.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# On-demand AI component downloads (Windows/macOS/Linux native TLS, no extra build tools)
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
sha2 = "0.10"
# AI component manager: cancellation/timeouts (MIT), model zip archives via deflate (MIT OR Apache-2.0)
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }
flate2 = "1"
# Photo studio backend (src/photo): decode/encode, EXIF, thumbnails. All MIT/Apache/BSD.
# "avif" = encoder only (ravif + rav1e, pure Rust, no nasm); AVIF/HEIC decoding uses the OS codecs.
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "webp", "gif", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "avif"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
fast_image_resize = { version = "6", features = ["image"] }
rayon = "1.10"
# Lossy WebP encoding (libwebp, BSD-3-Clause, compiled from source by libwebp-sys)
webp = { version = "0.3", default-features = false }
crc32fast = "1"
# libmpv playback engine (src/engine): libmpv-2.dll is loaded at RUNTIME (dynamic linking keeps
# the LGPL build replaceable and lets the app fall back to the HTML5 engine). libloading is ISC.
libloading = "0.8"
# Platform: persistent settings + window size/position (MIT OR Apache-2.0)
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# Media actions (Plan 06): recycle bin (MIT), clipboard text/image/file list (MIT OR Apache-2.0),
# music tags + cover art + lyrics (MIT OR Apache-2.0)
trash = "5"
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
lofty = "0.22"
# Shared storage library.db (Plan 13/L01): rusqlite (MIT) with bundled SQLite (public domain);
# pinned: 0.40.2 released 2026-08-08. uuid (MIT OR Apache-2.0) for media ids.
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
# Library folder watcher (Plan 13/L02; only an accelerator, reconciliation scans stay the
# source of truth): notify CC0-1.0, pinned 8.2.0 released 2025-08-03.
notify = "=8.2.0"
# UPnP/DLNA cast (Plan 13/L04): XML reader for device descriptions and SOAP answers. MIT,
# pinned 0.42.0 (already in the tree via tauri); DOCTYPE/custom entities are refused by src/cast/xml.rs.
quick-xml = "=0.42.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Power",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Imaging",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "System_UserProfile",
  "Win32_System_WinRT",
] }
windows-collections = "0.3"


[target.'cfg(target_os = "linux")'.dependencies]
# Linux video surface (ADR 0002): GtkGLArea/GtkOverlay inside the Tauri window. Same gtk-rs 0.18
# (MIT) that Tauri/wry already use on Linux: no new crate in Cargo.lock.
gtk = "=0.18.2"

[target.'cfg(unix)'.dependencies]
# Free disk space before AI downloads (statvfs; MIT OR Apache-2.0)
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Second launch with a file opens it in the running window (MIT OR Apache-2.0)
tauri-plugin-single-instance = "2"
# Signed self-update (R02 updater card; MIT OR Apache-2.0). Pinned: 2.13.3 released 2026-10-10.
tauri-plugin-updater = "=2.13.3"
# Known user folders for the identifier migration (MIT OR Apache-2.0; already used by Tauri)
dirs = "7"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
