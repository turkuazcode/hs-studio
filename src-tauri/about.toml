# cargo-about configuration: licenses VHO accepts for compiled-in Rust crates.
# Regenerate notices with:  powershell -File ..\legal\generate-notices.ps1
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
workarounds = ["ring", "rustls"]
# Evaluate target-specific dependencies for the platforms VHO ships on. Without this,
# cfg(fuzzing)-only deps (rav1e -> libfuzzer-sys, NCSA) are counted although they are
# never compiled into the app.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
