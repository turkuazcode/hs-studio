[package]
name = "vho-fixture-gen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Writes VHO's synthetic test clips with Windows Media Foundation (no third-party media)"
license = "MIT"

# Standalone: not part of the app crate, never shipped.
[workspace]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
] }

[profile.release]
opt-level = 2
